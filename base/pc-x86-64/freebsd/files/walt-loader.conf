# Note: for debugging bootup on a virtual node, one can
# uncomment boot_serial="YES" below; BUT this will cause
# physical nodes to fail booting unless they have a
# serial line, so do not push this change on an image
# you publish.
#boot_serial="YES"
#console="comconsole"
console="vidconsole"
beastie_disable="YES"
loader_autoboot_show="NO"
comconsole_speed="115200"
init_path="/bin/walt-init"
autoboot_delay="0"
unionfs_load="YES"
boot.nfsroot.options="nolockd"
